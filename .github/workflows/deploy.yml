# Automatic deployment to Hostinger over FTP.
#
# Every push to this branch uploads changed files to public_html.
# One-time setup — add three repository secrets on GitHub
# (repo → Settings → Secrets and variables → Actions → New repository secret):
#
#   FTP_SERVER    e.g. 82.198.xxx.xxx or ftp.monsterlist.org
#                 (Hostinger hPanel → Files → FTP Accounts)
#   FTP_USERNAME  e.g. u312278121.monsterlist.org
#   FTP_PASSWORD  the FTP account password
#
# Your server's app/config.php and everything in uploads/ are never touched.

name: Deploy to Hostinger

on:
  push:
    branches: [claude/magical-dirac-91banx, main]
  workflow_dispatch: {}        # manual "Run workflow" button

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          # Never upload or delete these on the server:
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            app/config.php
            uploads/**
